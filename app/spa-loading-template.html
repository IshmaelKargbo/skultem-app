<div style="
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background:
    radial-gradient(circle at 20% 20%, rgba(24, 120, 197, 0.35), transparent 55%),
    radial-gradient(circle at 80% 85%, rgba(64, 199, 186, 0.28), transparent 55%),
    #0b1220;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  z-index: 9999;
">
  <div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    animation: skultem-rise 0.5s ease-out;
  ">
    <div style="
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0 rgba(24, 120, 197, 0.45);
      animation: skultem-pulse-ring 2.2s ease-out infinite;
    ">
      <img src="/icon.svg" alt="Skultem" style="width: 44px; height: auto; animation: skultem-breathe 2.2s ease-in-out infinite;" />
    </div>

    <div style="text-align: center;">
      <p style="
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #f8fafc;
      ">Skultem</p>

      <p style="
        margin: 6px 0 0;
        font-size: 13px;
        color: rgba(226, 232, 240, 0.65);
      ">Getting your school ready&hellip;</p>
    </div>

    <div style="display: flex; gap: 6px;">
      <span style="width: 7px; height: 7px; border-radius: 9999px; background: #1878c5; animation: skultem-bounce 1s ease-in-out -0.32s infinite;"></span>
      <span style="width: 7px; height: 7px; border-radius: 9999px; background: #40c7ba; animation: skultem-bounce 1s ease-in-out -0.16s infinite;"></span>
      <span style="width: 7px; height: 7px; border-radius: 9999px; background: #1878c5; animation: skultem-bounce 1s ease-in-out infinite;"></span>
    </div>
  </div>

  <style>
    @keyframes skultem-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes skultem-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes skultem-pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(24, 120, 197, 0.45); }
      70% { box-shadow: 0 0 0 16px rgba(24, 120, 197, 0); }
      100% { box-shadow: 0 0 0 0 rgba(24, 120, 197, 0); }
    }
    @keyframes skultem-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</div>
